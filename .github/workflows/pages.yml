# Publie le dossier web/ sur GitHub Pages à chaque push sur main
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Numéro de version sur les scripts (pas de mélange ancien / nouveau dans le cache)
        run: |
          V=${GITHUB_SHA::8}
          sed -i -E "s#(src|href)=\"((js|css|lib)/[^\"?]+\.(js|css|mjs))\"#\1=\"\2?v=$V\"#g" web/index.html
          for f in web/js/*.js web/js/partoche/*.js; do
            sed -i -E "s#((from|import)\s*\(?\s*')(\.{1,2}/[^'?]+\.m?js)'#\1\3?v=$V'#g" "$f"
          done
          grep -c "?v=$V" web/index.html web/js/app.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
